name: Deploy Production

on:
    push:
        branches:
            - main

jobs:
    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest
        environment:
            name: production
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build & Push Docker Image (Production)
              env:
                  ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  if [ -z "$ECR_REPOSITORY_URL" ]; then
                    echo "ECR_REPOSITORY_URL is not set."
                    exit 1
                  fi
                  docker build \
                    -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" \
                    -t "$ECR_REPOSITORY_URL:latest" \
                    .
                  docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"
                  docker push "$ECR_REPOSITORY_URL:latest"

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: "1.0.0"

            - name: Terraform Init (Production)
              working-directory: ./terraform
              env:
                  TF_BACKEND_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
                  TF_BACKEND_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
              run: |
                  terraform init \
                    -backend-config="bucket=${TF_BACKEND_BUCKET}" \
                    -backend-config="key=production/terraform.tfstate" \
                    -backend-config="region=${TF_BACKEND_REGION}" \
                    -backend-config="encrypt=true"

            - name: Terraform Plan (Production)
              working-directory: ./terraform
              env:
                  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
                  HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
                  ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
                  ECS_ASSIGN_PUBLIC_IP: "true"
                  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
                  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
                  GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
                  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
                  SECRETS_MANAGER_ENV_VARS: ${{ secrets.SECRETS_MANAGER_ENV_VARS }}
                  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
                  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
                  LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
                  OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
                  OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
                  DYNAMODB_USER_SETTINGS_TABLE: ${{ secrets.DYNAMODB_USER_SETTINGS_TABLE }}
                  DYNAMODB_ROUTINES_TABLE: ${{ secrets.DYNAMODB_ROUTINES_TABLE }}
                  DYNAMODB_AI_EXECUTION_LOGS_TABLE: ${{ secrets.DYNAMODB_AI_EXECUTION_LOGS_TABLE }}
              run: |
                  NORMALIZED_SECRETS_MANAGER_ENV_VARS="${SECRETS_MANAGER_ENV_VARS// /}"
                  has_secret() {
                    echo "$NORMALIZED_SECRETS_MANAGER_ENV_VARS" | grep -q "${1}="
                  }
                  missing=false
                  if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ] && ! has_secret "GOOGLE_OAUTH_CLIENT_ID"; then
                    missing=true
                  fi
                  if [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ] && ! has_secret "GOOGLE_OAUTH_CLIENT_SECRET"; then
                    missing=true
                  fi
                  if [ -z "$GOOGLE_OAUTH_REDIRECT_URI" ] && ! has_secret "GOOGLE_OAUTH_REDIRECT_URI"; then
                    missing=true
                  fi
                  if [ -z "$AUTH_SECRET" ] && ! has_secret "AUTH_SECRET"; then
                    missing=true
                  fi
                  if [ "$missing" = true ]; then
                    echo "Required OAuth secrets are not set in GitHub Secrets or Secrets Manager."
                    exit 1
                  fi
                  DYNAMODB_USER_SETTINGS_TABLE=${DYNAMODB_USER_SETTINGS_TABLE:-routune-hub-production-user-settings}
                  DYNAMODB_ROUTINES_TABLE=${DYNAMODB_ROUTINES_TABLE:-routune-hub-production-routines}
                  DYNAMODB_AI_EXECUTION_LOGS_TABLE=${DYNAMODB_AI_EXECUTION_LOGS_TABLE:-routune-hub-production-ai-execution-logs}
                  ENV_VARS="CALENDAR_CLIENT='google'"
                  if ! has_secret "GOOGLE_OAUTH_CLIENT_ID"; then
                    ENV_VARS+=",GOOGLE_OAUTH_CLIENT_ID='${GOOGLE_OAUTH_CLIENT_ID}'"
                  fi
                  if ! has_secret "GOOGLE_OAUTH_CLIENT_SECRET"; then
                    ENV_VARS+=",GOOGLE_OAUTH_CLIENT_SECRET='${GOOGLE_OAUTH_CLIENT_SECRET}'"
                  fi
                  if ! has_secret "GOOGLE_OAUTH_REDIRECT_URI"; then
                    ENV_VARS+=",GOOGLE_OAUTH_REDIRECT_URI='${GOOGLE_OAUTH_REDIRECT_URI}'"
                  fi
                  if ! has_secret "AUTH_SECRET"; then
                    ENV_VARS+=",AUTH_SECRET='${AUTH_SECRET}'"
                  fi
                  ENV_VARS+=",DYNAMODB_USER_SETTINGS_TABLE='${DYNAMODB_USER_SETTINGS_TABLE}',DYNAMODB_ROUTINES_TABLE='${DYNAMODB_ROUTINES_TABLE}',DYNAMODB_AI_EXECUTION_LOGS_TABLE='${DYNAMODB_AI_EXECUTION_LOGS_TABLE}',NODE_ENV='production'"
                  if [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ]; then
                    ENV_VARS+=" ,LANGFUSE_PUBLIC_KEY='${LANGFUSE_PUBLIC_KEY}',LANGFUSE_SECRET_KEY='${LANGFUSE_SECRET_KEY}'"
                  fi
                  if [ -n "$LANGFUSE_BASE_URL" ]; then
                    ENV_VARS+=" ,LANGFUSE_BASE_URL='${LANGFUSE_BASE_URL}'"
                  fi
                  if [ -n "$OPENALEX_API_KEY" ]; then
                    ENV_VARS+=" ,OPENALEX_API_KEY='${OPENALEX_API_KEY}'"
                  fi
                  if [ -n "$OPENALEX_MAILTO" ]; then
                    ENV_VARS+=" ,OPENALEX_MAILTO='${OPENALEX_MAILTO}'"
                  fi
                  SECRET_ENV_VARS="{${SECRETS_MANAGER_ENV_VARS}}"
                  terraform plan \
                    -var="environment=production" \
                    -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
                    -var="subnet_ids=[${{ secrets.AWS_SUBNET_IDS }}]" \
                    -var="domain_name=${DOMAIN_NAME}" \
                    -var="hosted_zone_id=${HOSTED_ZONE_ID}" \
                    -var="acm_certificate_arn=${ACM_CERTIFICATE_ARN}" \
                    -var="ecr_repository_url=${{ secrets.ECR_REPOSITORY_URL }}" \
                    -var="docker_image_tag=${{ github.sha }}" \
                    -var="ecs_desired_count=${{ secrets.ECS_DESIRED_COUNT || '2' }}" \
                    -var="ecs_assign_public_ip=${ECS_ASSIGN_PUBLIC_IP}" \
                    -var="env_vars={${ENV_VARS}}" \
                    -var="secret_env_vars=${SECRET_ENV_VARS}" \
                    -out=tfplan

            - name: Terraform Apply (Production)
              working-directory: ./terraform
              run: terraform apply tfplan

            - name: Get deployment status
              working-directory: ./terraform
              run: |
                  echo "Production deployment completed"
                  echo "ALB DNS: $(terraform output -raw alb_dns_name)"
                  echo "App URL: $(terraform output -raw app_url)"
