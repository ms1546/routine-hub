name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ECR repository
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
        run: |
          if [ -z "$ECR_REPOSITORY_URL" ]; then
            echo "ECR_REPOSITORY_URL is not set."
            exit 1
          fi

      - name: Build & Push Docker Image (Production)
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          IMAGE_TAG: ${{ github.sha }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }}
            ${{ secrets.ECR_REPOSITORY_URL }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"

      - name: Terraform Init (Production)
        working-directory: ./terraform
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=production/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan (Production)
        working-directory: ./terraform
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          ECS_ASSIGN_PUBLIC_IP: "true"
          SM_GOOGLE_OAUTH_CLIENT_ID_ARN: ${{ secrets.SM_GOOGLE_OAUTH_CLIENT_ID_ARN }}
          SM_GOOGLE_OAUTH_CLIENT_SECRET_ARN: ${{ secrets.SM_GOOGLE_OAUTH_CLIENT_SECRET_ARN }}
          SM_GOOGLE_OAUTH_REDIRECT_URI_ARN: ${{ secrets.SM_GOOGLE_OAUTH_REDIRECT_URI_ARN }}
          SM_AUTH_SECRET_ARN: ${{ secrets.SM_AUTH_SECRET_ARN }}
          SM_LANGFUSE_PUBLIC_KEY_ARN: ${{ secrets.SM_LANGFUSE_PUBLIC_KEY_ARN }}
          SM_LANGFUSE_SECRET_KEY_ARN: ${{ secrets.SM_LANGFUSE_SECRET_KEY_ARN }}
          SM_OPENALEX_API_KEY_ARN: ${{ secrets.SM_OPENALEX_API_KEY_ARN }}
          SM_OPENALEX_MAILTO_ARN: ${{ secrets.SM_OPENALEX_MAILTO_ARN }}
          DYNAMODB_USER_SETTINGS_TABLE: ${{ secrets.DYNAMODB_USER_SETTINGS_TABLE }}
          DYNAMODB_ROUTINES_TABLE: ${{ secrets.DYNAMODB_ROUTINES_TABLE }}
          DYNAMODB_AI_EXECUTION_LOGS_TABLE: ${{ secrets.DYNAMODB_AI_EXECUTION_LOGS_TABLE }}
        run: |
          missing=false
          if [ -z "$SM_GOOGLE_OAUTH_CLIENT_ID_ARN" ]; then
            missing=true
          fi
          if [ -z "$SM_GOOGLE_OAUTH_CLIENT_SECRET_ARN" ]; then
            missing=true
          fi
          if [ -z "$SM_GOOGLE_OAUTH_REDIRECT_URI_ARN" ]; then
            missing=true
          fi
          if [ -z "$SM_AUTH_SECRET_ARN" ]; then
            missing=true
          fi
          if [ "$missing" = true ]; then
            echo "Required OAuth secrets are not set in GitHub Secrets (Secrets Manager ARN values)."
            exit 1
          fi
          DYNAMODB_USER_SETTINGS_TABLE=${DYNAMODB_USER_SETTINGS_TABLE:-routune-hub-production-user-settings}
          DYNAMODB_ROUTINES_TABLE=${DYNAMODB_ROUTINES_TABLE:-routune-hub-production-routines}
          DYNAMODB_AI_EXECUTION_LOGS_TABLE=${DYNAMODB_AI_EXECUTION_LOGS_TABLE:-routune-hub-production-ai-execution-logs}
          ENV_VARS="CALENDAR_CLIENT=\"google\""
          ENV_VARS+=",DYNAMODB_USER_SETTINGS_TABLE=\"${DYNAMODB_USER_SETTINGS_TABLE}\",DYNAMODB_ROUTINES_TABLE=\"${DYNAMODB_ROUTINES_TABLE}\",DYNAMODB_AI_EXECUTION_LOGS_TABLE=\"${DYNAMODB_AI_EXECUTION_LOGS_TABLE}\",NODE_ENV=\"production\""
          ENV_VARS+=",LANGFUSE_BASE_URL=\"https://us.cloud.langfuse.com\""
          ENV_VARS+=",BEDROCK_ENABLED=\"true\""
          ENV_VARS+=",AWS_BEDROCK_GUARDRAIL_ARN=\"${{ secrets.AWS_BEDROCK_GUARDRAIL_ARN }}\",AWS_BEDROCK_GUARDRAIL_ID=\"${{ secrets.AWS_BEDROCK_GUARDRAIL_ID }}\",AWS_BEDROCK_GUARDRAIL_VERSION=\"${{ secrets.AWS_BEDROCK_GUARDRAIL_VERSION }}\""
          SECRETS_MANAGER_ENV_VARS=""
          add_secret() {
            if [ -n "$2" ]; then
              if [ -n "$SECRETS_MANAGER_ENV_VARS" ]; then
                SECRETS_MANAGER_ENV_VARS+=",";
              fi
              SECRETS_MANAGER_ENV_VARS+="${1}=\"${2}\""
            fi
          }
          add_secret "GOOGLE_OAUTH_CLIENT_ID" "$SM_GOOGLE_OAUTH_CLIENT_ID_ARN"
          add_secret "GOOGLE_OAUTH_CLIENT_SECRET" "$SM_GOOGLE_OAUTH_CLIENT_SECRET_ARN"
          add_secret "GOOGLE_OAUTH_REDIRECT_URI" "$SM_GOOGLE_OAUTH_REDIRECT_URI_ARN"
          add_secret "AUTH_SECRET" "$SM_AUTH_SECRET_ARN"
          add_secret "LANGFUSE_PUBLIC_KEY" "$SM_LANGFUSE_PUBLIC_KEY_ARN"
          add_secret "LANGFUSE_SECRET_KEY" "$SM_LANGFUSE_SECRET_KEY_ARN"
          add_secret "OPENALEX_API_KEY" "$SM_OPENALEX_API_KEY_ARN"
          add_secret "OPENALEX_MAILTO" "$SM_OPENALEX_MAILTO_ARN"
          if [ -n "$SECRETS_MANAGER_ENV_VARS" ]; then
            SECRET_ENV_VARS="{${SECRETS_MANAGER_ENV_VARS}}"
          else
            SECRET_ENV_VARS="{}"
          fi
          terraform plan \
            -var="environment=production" \
            -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
            -var="subnet_ids=[${{ secrets.AWS_SUBNET_IDS }}]" \
            -var="domain_name=${DOMAIN_NAME}" \
            -var="hosted_zone_id=${HOSTED_ZONE_ID}" \
            -var="acm_certificate_arn=${ACM_CERTIFICATE_ARN}" \
            -var="ecr_repository_url=${{ secrets.ECR_REPOSITORY_URL }}" \
            -var="docker_image_tag=${{ github.sha }}" \
            -var="ecs_desired_count=${{ secrets.ECS_DESIRED_COUNT || '2' }}" \
            -var="ecs_assign_public_ip=${ECS_ASSIGN_PUBLIC_IP}" \
            -var="env_vars={${ENV_VARS}}" \
            -var="secret_env_vars=${SECRET_ENV_VARS}" \
            -out=tfplan

      - name: Terraform Apply (Production)
        working-directory: ./terraform
        run: terraform apply tfplan

      - name: Get deployment status
        working-directory: ./terraform
        run: |
          echo "Production deployment completed"
          echo "ALB DNS: $(terraform output -raw alb_dns_name)"
          echo "App URL: $(terraform output -raw app_url)"
