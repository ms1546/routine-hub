name: PR Preview Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or destroy"
        required: true
        default: "deploy"
      pr_number:
        description: "Pull request number"
        required: true

jobs:
  deploy-preview:
    name: Deploy Preview Environment
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.inputs.pr_number }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
        run: |
          missing=false
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then missing=true; fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then missing=true; fi
          if [ -z "$ECR_REPOSITORY_URL" ]; then missing=true; fi
          if [ -z "$TERRAFORM_STATE_BUCKET" ]; then missing=true; fi
          if [ "$missing" = true ]; then
            echo "Required secrets are missing for preview deployment."
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Force mock mode for preview environments
          MASTRA_USE_MOCK: "true"
          # Disable calendar writes in preview
          DISABLE_CALENDAR_WRITES: "true"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image (PR)
        env:
          ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}
          IMAGE_TAG: pr-${{ github.event.inputs.pr_number }}
          MASTRA_USE_MOCK: "true"
          DISABLE_CALENDAR_WRITES: "true"
        run: |
          if [ -z "$ECR_REPOSITORY_URL" ]; then
            echo "ECR_REPOSITORY_URL is not set."
            exit 1
          fi
          docker build \
            --build-arg MASTRA_USE_MOCK="$MASTRA_USE_MOCK" \
            --build-arg DISABLE_CALENDAR_WRITES="$DISABLE_CALENDAR_WRITES" \
            -t "$ECR_REPOSITORY_URL:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY_URL:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"

      - name: Terraform Init (Preview)
        working-directory: ./terraform
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=preview/pr-${{ github.event.inputs.pr_number }}/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (Preview)
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="environment=preview" \
            -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
            -var="subnet_ids=[${{ secrets.AWS_SUBNET_IDS }}]" \
            -var="pr_number=${{ github.event.inputs.pr_number }}" \
            -var="ecr_repository_url=${{ secrets.ECR_REPOSITORY_URL }}" \
            -var="docker_image_tag=pr-${{ github.event.inputs.pr_number }}" \
            -var="env_vars={MASTRA_USE_MOCK='true',DISABLE_CALENDAR_WRITES='true',NODE_ENV='preview'}"

      - name: Get ALB DNS name
        id: alb_dns
        working-directory: ./terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "url=http://$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview environment deployed!\n\n**URL**: ${{ steps.alb_dns.outputs.url }}\n\n**Note**: This is a preview environment with:\n- AI workflows forced to mock mode\n- Calendar writes disabled\n- Ephemeral resources (will be destroyed when PR is closed)`
            })

  destroy-preview:
    name: Destroy Preview Environment
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.inputs.pr_number }}
    permissions:
      contents: read
    steps:
      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TERRAFORM_STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
        run: |
          missing=false
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then missing=true; fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then missing=true; fi
          if [ -z "$TERRAFORM_STATE_BUCKET" ]; then missing=true; fi
          if [ "$missing" = true ]; then
            echo "Required secrets are missing for preview cleanup."
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.0.0"

      - name: Terraform Init (Destroy Preview)
        working-directory: ./terraform
        env:
          TF_BACKEND_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TF_BACKEND_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-1' }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=preview/pr-${{ github.event.inputs.pr_number }}/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy (Preview)
        working-directory: ./terraform
        run: |
          terraform destroy -auto-approve \
            -var="environment=preview" \
            -var="vpc_id=${{ secrets.AWS_VPC_ID }}" \
            -var="subnet_ids=[${{ secrets.AWS_SUBNET_IDS }}]" \
            -var="pr_number=${{ github.event.inputs.pr_number }}"
